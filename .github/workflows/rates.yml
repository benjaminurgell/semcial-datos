name: Tipos de cambio

# Una vez por día, de lunes a viernes, después de que publican los bancos centrales
# (21:30 UTC = 18:30 en Buenos Aires). También se puede correr a mano desde Actions.
on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Consultar los bancos centrales
        run: python3 fetch_rates.py

      - name: Guardar si cambió
        run: |
          if git diff --quiet rates.json; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git commit -m "Tipos de cambio $(date -u +%F)"
          git push

      # jsDelivr guarda el archivo en caché hasta 12 horas: se le pide que lo renueve
      - name: Renovar la caché del CDN
        run: curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/rates.json" || true
